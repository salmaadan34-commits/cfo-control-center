<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halden CFO Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<!-- Development entry point. src/body.html holds the same markup; `npm run build` bundles everything into dist/index.html. -->
<div id="mount"></div>
<script>
  // Load the shared markup, then the engine and UI scripts.
  fetch('src/body.html').then((r) => r.text()).then((html) => {
    document.getElementById('mount').outerHTML = html;
    ['src/data.js', 'src/engine.js', 'src/app.js'].reduce((p, src) => p.then(() => new Promise((res) => {
      const s = document.createElement('script'); s.src = src; s.onload = res; document.body.appendChild(s);
    })), Promise.resolve());
  });
</script>
</body>
</html>
